<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153d65"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="후드 풍량 계산"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>후드별 필요 환기량 계산기</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:#182c3d;background:#edf3f8}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:20px 15px 55px}.hero{background:#153d65;color:white;border-radius:19px;padding:23px;margin-bottom:16px}h1{font-size:23px;margin:0 0 8px}h2{font-size:17px;margin:0 0 12px}.hero p{margin:0;color:#d2e4f3;font-size:13px}.card{background:white;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 2px 14px #0b335012}.tabs{display:flex;gap:8px}.tabs button{flex:1;background:#edf2f7;border:1px solid #dae4ed;border-radius:10px;padding:12px 3px;color:#345;cursor:pointer;font-weight:700}.tabs button.active{background:#153d65;color:white}.field{margin:12px 0}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}select,input{width:100%;font-size:17px;border:1px solid #c8d5df;border-radius:10px;padding:12px;background:white;color:#183044}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.diagram{background:#f4f8fb;border:1px solid #dce7ef;border-radius:12px;overflow:hidden}.diagram svg{display:block;width:100%;height:auto}.muted{color:#617589;font-size:12px;line-height:1.55}.formula{background:#eff6fd;border-radius:10px;padding:13px;font-size:16px;font-weight:700;overflow-wrap:anywhere}.results{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#eaf5ff;padding:16px 10px;border-radius:12px;text-align:center}.metric strong{font-size:23px;display:block;color:#07538d}.metric small{font-size:12px;color:#3d627e}.warning{background:#fff7e8;border-left:4px solid #c68b27;padding:12px;border-radius:7px;color:#644a20;font-size:12px;line-height:1.6}.actions{display:flex;gap:9px}.actions button{flex:1;border:0;border-radius:10px;padding:13px;font-weight:700;background:#153d65;color:white}.actions button.secondary{background:#e6edf3;color:#173c59}footer{font-size:11px;color:#657a8d;line-height:1.6}
</style></head><body><main><header class="hero"><h1>후드별 필요 환기량 계산기</h1><p>국소배기장치 · 후드 구조도 · CMS / CMM</p></header><section class="card"><h2>1. 후드 선택</h2><div class="tabs" id="tabs"><button data-cat="enclosure">포위식</button><button data-cat="external" class="active">외부식</button><button data-cat="receiver">리시버식</button></div><div class="field"><label for="kind">후드 세부 형식</label><select id="kind"></select></div></section><section class="card"><h2>2. 후드 구조 및 계산식</h2><div class="diagram" id="diagram"></div><p class="muted" id="diagramNote"></p><div class="formula" id="formula"></div><p class="muted" id="formulaNote"></p></section><section class="card"><h2>3. 측정값 입력</h2><div class="field" id="shapeWrap"><label for="shape">외부식 개구부 형태</label><select id="shape"><option value="rect">장방형 (길이 × 높이)</option><option value="circle">원형 (직경)</option></select></div><div class="inputs"><div class="field"><label for="v">제어속도 V (m/s)</label><input id="v" type="number" inputmode="decimal" min="0" step="any" value="0.5"></div><div class="field" id="xWrap"><label for="x">제어거리 X (cm)</label><input id="x" type="number" inputmode="decimal" min="0" step="any" value="20"></div><div class="field"><label for="l" id="lLabel">길이 L (cm)</label><input id="l" type="number" inputmode="decimal" min="0" step="any" value="100"></div><div class="field" id="wWrap"><label for="w" id="wLabel">높이 H (cm)</label><input id="w" type="number" inputmode="decimal" min="0" step="any" value="40"></div><div class="field" id="dWrap" hidden><label for="d">직경 D (cm)</label><input id="d" type="number" inputmode="decimal" min="0" step="any" value="40"></div></div><div class="formula" id="areaFormula" style="font-size:13px;margin-top:8px">개구부 면적 A = L × H</div><p class="muted" id="areaResult"></p><div class="field" id="nWrap" hidden><label for="n">슬롯 단수 N (2 이상, 참고값)</label><input id="n" type="number" inputmode="numeric" min="2" step="1" value="3"></div><div class="warning" id="warning"></div></section><section class="card"><h2>4. 필요 환기량 결과</h2><div class="results"><div class="metric"><small>CMS (m³/s)</small><strong id="cms">—</strong></div><div class="metric"><small>CMM (m³/min)</small><strong id="cmm">—</strong></div></div><p class="muted" id="steps"></p><div class="actions"><button id="copy">결과 복사</button><button class="secondary" id="reset">초기화</button></div></section><footer>이 계산기는 교육·예비 산정용입니다. 후드 형상, 슬롯 배열, 포위율, 횡기류, 열부력 등 실제 조건에 맞는 검토가 필요합니다. 특히 다단 슬롯 및 캐노피의 단순화된 식을 최종 설계의 유일한 근거로 사용하지 마세요.</footer></main><script>
const configs={enclosure:[['enclosed','포위식']],external:[['plain','일반형'],['flanged','플랜지 일반형'],['slot','슬롯형'],['flangedSlot','플랜지 슬롯형'],['multi','다단 슬롯형'],['flangedMulti','플랜지 다단 슬롯형']],receiver:[['canopy','캐노피형']]};let cat='external';const $=id=>document.getElementById(id);const get=()=>$('kind').value;function draw(kind){const isCanopy=kind==='canopy',isEnclosed=kind==='enclosed',isSlot=kind==='slot'||kind==='flangedSlot',isMulti=kind==='multi'||kind==='flangedMulti',flanged=['flanged','flangedSlot','flangedMulti'].includes(kind);let hood='';if(isEnclosed){hood='<rect x="75" y="45" width="210" height="150" rx="6" fill="#cfe2f0" stroke="#215779" stroke-width="4"/><rect x="100" y="85" width="160" height="100" fill="#fff" stroke="#215779" stroke-dasharray="6 4" stroke-width="2"/><path d="M170 45 V18 H225" stroke="#215779" stroke-width="17" fill="none"/>'}else if(isCanopy){hood='<path d="M75 85 L110 48 H260 L295 85 Z" fill="#c5dfed" stroke="#215779" stroke-width="4"/><path d="M185 48 V12" stroke="#215779" stroke-width="19"/><rect x="113" y="207" width="148" height="12" rx="3" fill="#c4a88b"/><path d="M130 195 Q115 164 145 145 M186 195 Q170 162 196 137 M241 195 Q225 165 245 145" stroke="#d27d4b" stroke-width="3" fill="none"/><path d="M100 106 V174 M280 106 V174" stroke="#188caa" stroke-width="2" stroke-dasharray="5 5"/><text x="290" y="148" fill="#14607b" font-size="15">H</text>'}else{const start=isSlot||isMulti?58:95;hood='<path d="M'+start+' 55 H'+(start+36)+' L'+(start+60)+' 92 V160 L'+(start+36)+' 196 H'+start+' Z" fill="#c6dfec" stroke="#215779" stroke-width="4"/><path d="M'+start+' 123 H24" stroke="#215779" stroke-width="20"/>';if(flanged)hood+='<path d="M'+(start+60)+' 76 V176" stroke="#215779" stroke-width="9"/>';if(isSlot){hood+='<path d="M'+(start+62)+' 92 V160" stroke="#185a84" stroke-width="5"/>';}if(isMulti){for(let i=0;i<3;i++)hood+='<rect x="'+(start+58)+'" y="'+(89+i*26)+'" width="8" height="12" fill="#195b86"/>';}hood+='<circle cx="310" cy="127" r="16" fill="#d6a16a"/><path d="M287 127 H'+(start+76)+'" stroke="#1989a5" stroke-width="3" stroke-dasharray="7 5"/><path d="M'+(start+77)+' 122 L'+(start+67)+' 127 L'+(start+77)+' 132" stroke="#1989a5" stroke-width="3" fill="none"/><path d="M'+(start+72)+' 212 H294" stroke="#1989a5" stroke-width="2"/><path d="M'+(start+72)+' 207 v10 M294 207 v10" stroke="#1989a5" stroke-width="2"/><text x="'+(start+140)+'" y="207" font-size="15" fill="#14607b">H</text>';}const label=isCanopy?'캐노피 후드':isEnclosed?'포위식 후드':isMulti?'다단 슬롯 후드':isSlot?'슬롯 후드':'외부식 후드';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 265" role="img" aria-label="${label} 개념도"><rect width="370" height="265" fill="#f4f8fb"/>${hood}<text x="14" y="248" fill="#617789" font-size="12">개념도 (축척 아님) · L/W는 개구부 또는 발생원 치수</text></svg>`}
function config(){const k=get();const circle=cat==='external'&&$('shape').value==='circle';$('shapeWrap').hidden=cat!=='external';$('lLabel').textContent=circle?'직경은 아래에 입력': '길이 L (cm)';$('l').closest('.field').hidden=circle;$('wWrap').hidden=circle;$('dWrap').hidden=!circle;$('areaFormula').textContent=k==='canopy'?'작업대 주변길이 P = 2 × (가로 + 세로)':circle?'A = π × (D / 2)²':'A = L × H';const formulas={enclosed:'Q = V × L × W',plain:'Q = V × (10X² + A)',flanged:'Q = 0.75 × V × (10X² + A)',slot:'Q = 3.7 × L × X × V',flangedSlot:'Q = 2.6 × L × X × V',multi:'Q ≈ V × (10X² + A)',flangedMulti:'Q ≈ 0.75 × V × (10X² + A)',canopy:'Q ≈ 1.4 × P × H × V'};$('formula').textContent=formulas[k]+'   [CMS]';$('diagram').innerHTML=draw(k);$('xWrap').hidden=k==='enclosed';$('xWrap').querySelector('label').textContent=k==='canopy'?'작업대와 후드 사이 수직거리 H (cm)':'제어거리 X (cm)';$('nWrap').hidden=!k.toLowerCase().includes('multi');$('lLabel').textContent=k==='canopy'?'작업대 가로 L (cm)':k==='enclosed'?'개방부 길이 L (cm)':'후드/슬롯 길이 L (cm)';$('wLabel').textContent=k==='canopy'?'작업대 세로 W (cm)':k==='enclosed'?'개방부 폭 W (cm)':'높이 H (cm)';$('diagramNote').textContent=k==='canopy'?'L과 W는 작업대 가로·세로, H는 작업대에서 후드까지의 수직거리입니다. 후드 돌출 길이와 열상승 기류는 별도 검토합니다.':k==='enclosed'?'L × W는 실제 열린 면의 총면적입니다. 여러 개방부가 있으면 개방면적을 합산해야 합니다.':'X는 오염물질 발생점과 후드 흡입면 사이 거리입니다. L/W는 선택한 경험식에 대응하는 개구부 치수입니다.';$('formulaNote').textContent=k==='canopy'?'P = 2(L + W), H = 작업대와 후드 간 수직거리. 모든 길이는 m로 환산하며 Q는 CMS입니다.': '장방형 A = L × H, 원형 A = πD²/4. 모든 치수는 cm에서 m로 환산합니다. 슬롯형은 긴 직선 슬롯 기준으로 원형 개구부를 지원하지 않습니다.';calculate()}
function calculate(){
 const k=get(),circle=cat==='external'&&$('shape').value==='circle';
 const v=+$('v').value,x=+$('x').value/100,l=+$('l').value/100,w=+$('w').value/100,d=+$('d').value/100,n=+$('n').value;
 const slot=['slot','flangedSlot','multi','flangedMulti'].includes(k);
 const sizeValid=circle?($('d').value!==''&&Number.isFinite(d)&&d>0):(['l','w'].every(id=>$(id).value!==''&&Number.isFinite(+$(id).value)&&+$(id).value>0));
 const valid=$('v').value!==''&&Number.isFinite(v)&&v>0&&sizeValid&&(k==='enclosed'||($('x').value!==''&&Number.isFinite(x)&&x>=0))&&(!k.toLowerCase().includes('multi')||(Number.isInteger(n)&&n>=2))&&!(circle&&slot);
 const A=circle?Math.PI*d*d/4:l*w;
 $('areaResult').textContent=sizeValid?(k==='canopy'?`작업대 주변길이 P = ${(2*(l+w)).toFixed(3)} m (${(2*(l+w)*100).toFixed(1)} cm)`:`계산된 면적 A = ${A.toFixed(4)} m² (${(A*10000).toFixed(2)} cm²)`):'치수를 입력하세요.';
 let q=NaN;
 if(valid){if(k==='enclosed')q=v*A;else if(k==='plain')q=v*(10*x*x+A);else if(k==='flanged')q=.75*v*(10*x*x+A);else if(k==='slot')q=3.7*l*x*v;else if(k==='flangedSlot')q=2.6*l*x*v;else if(k==='multi')q=v*(10*x*x+A);else if(k==='flangedMulti')q=.75*v*(10*x*x+A);else if(k==='canopy')q=1.4*2*(l+w)*x*v;}
 $('cms').textContent=Number.isFinite(q)?q.toFixed(4):'—';$('cmm').textContent=Number.isFinite(q)?(60*q).toFixed(2):'—';
 $('steps').textContent=Number.isFinite(q)?`적용값: V=${v} m/s, ${k==='enclosed'?'':`${k==='canopy'?'H':'X'}=${(x*100).toFixed(1)} cm, `}${circle?`D=${(d*100).toFixed(1)} cm`:`L=${(l*100).toFixed(1)} cm, ${cat==='external'?'H':'W'}=${(w*100).toFixed(1)} cm`}${k==='canopy'?`, P=${(2*(l+w)).toFixed(3)} m` : `, A=${A.toFixed(4)} m²`}`:'입력값 또는 후드 형상 적용 조건을 확인하세요.';
 let warning='대표 경험식에 의한 예비 추정값입니다. 실제 적용 가능 범위와 설치 형상을 확인하세요.';
 if(circle&&slot)warning='원형 개구부에는 현재 슬롯형/다단 슬롯형 경험식을 적용하지 않습니다. 장방형(직선 슬롯)을 선택하거나 원형 일반형 후드를 선택하세요.';
 else if(k==='multi'||k==='flangedMulti')warning='주의: 다단 슬롯을 하나의 외곽 개구부로 단순화한 예비 추정식입니다. 슬롯별 분배풍량, 슬롯 폭·간격, 균등 흡입은 별도 검토해야 합니다.';
 else if(k==='canopy')warning='주의: 캐노피는 열부력·횡기류·후드 돌출 및 발생원 크기에 크게 좌우됩니다. 본 식은 개략 추정이며 최종 설계에 단독 사용하지 마세요.';
 else if(k==='slot'||k==='flangedSlot')warning='주의: 슬롯형 경험식은 긴 직선 슬롯 등 특정 형상 조건에서 사용합니다. 폭/길이 비율과 실제 슬롯 배치를 확인하세요.';
 else if(k==='enclosed')warning='주의: 포위식은 개방면 평균 유입속도 기준입니다. 실제 개방면적과 작업에 따른 개구부 변화를 반영하세요.';
 $('warning').textContent=warning;
}

function initCat(next){cat=next;document.querySelectorAll('[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));$('kind').innerHTML=configs[cat].map(([v,n])=>`<option value="${v}">${n}</option>`).join('');config()}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>initCat(b.dataset.cat));$('kind').onchange=config;$('shape').onchange=config;['v','x','l','w','d','n'].forEach(id=>$(id).addEventListener('input',calculate));$('reset').onclick=()=>{ $('v').value='.5';$('x').value='20';$('l').value='100';$('w').value='40';$('n').value='3';$('d').value='40';$('shape').value='rect';config()};$('copy').onclick=async()=>{const str=`${$('kind').selectedOptions[0].text}\n${$('formula').textContent}\nCMS: ${$('cms').textContent} m³/s\nCMM: ${$('cmm').textContent} m³/min`;try{await navigator.clipboard.writeText(str);$('copy').textContent='복사 완료';setTimeout(()=>$('copy').textContent='결과 복사',1300)}catch(e){alert('복사가 지원되지 않습니다. 결과를 길게 눌러 복사하세요.')}};initCat('external');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
